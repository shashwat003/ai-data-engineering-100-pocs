name: heavy-validation
# Expensive checks: Spark benchmarks, Terraform plan + mock apply, long evaluations.
# Runs manually, weekly, and when the heavy POCs or shared libs change. Required before a heavy POC
# is called fully verified.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    paths:
      - "pocs/**/.heavy-*"
      - "pocs/**/.own-env"
      - "pocs/015-*/**"
      - "pocs/019-*/**"
      - "pocs/039-*/**"
      - "pocs/043-*/**"
      - "pocs/051-*/**"
      - "pocs/052-*/**"
      - "pocs/053-*/**"
      - "pocs/054-*/**"
      - "pocs/055-*/**"
      - "pocs/057-*/**"
      - "pocs/059-*/**"
      - "pocs/058-*/**"
      - "pocs/062-*/**"
      - "pocs/064-*/**"
      - "pocs/063-*/**"
      - "pocs/079-*/**"
      - "pocs/040-*/**"
      - "pocs/083-*/**"
      - "pocs/033-*/**"
      - "pocs/032-*/**"
      - "pocs/041-*/**"
      - "pocs/042-*/**"
      - "pocs/050-*/**"
      - "pocs/076-*/**"
      - "libs/**"
      - ".github/workflows/heavy.yml"
permissions:
  contents: read
jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Install OPA v1.2.0 (pinned sha256, no third-party action)
        run: |
          curl -sSfL -o opa https://github.com/open-policy-agent/opa/releases/download/v1.2.0/opa_linux_amd64_static
          echo "059a1e540443bdf6b8ef45c670d6f6d26fafd30d5bc2537f59526ceefb766c55  opa" | sha256sum -c -
          sudo install -m 0755 opa /usr/local/bin/opa
      - name: Ensure PostgreSQL server binaries (POC 039)
        run: ls /usr/lib/postgresql/*/bin/postgres || (sudo apt-get update && sudo apt-get install -y postgresql)
      - run: pip install -r requirements-dev.txt -r requirements-infra.txt -r requirements-spark.txt -r requirements-dbt.txt -r requirements-dvc.txt -r requirements-dagster.txt -r requirements-playwright.txt -r requirements-postgres.txt -r requirements-cdk.txt
      - run: playwright install --with-deps chromium
      - run: python scripts/run_tests.py --heavy
      - name: Heavy demos (Spark runs in DEMO_QUICK smoke mode; full numbers come from local runs)
        env:
          DEMO_QUICK: "1"
        run: python scripts/run_demos.py --heavy
  airflow:
    # Airflow 3 pins SQLAlchemy 2 / other libs that conflict with the main requirements, so it gets its own job and environment.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned Airflow 3.3.2 lock (official constraints + PyJWT/urllib3 security overrides)
        run: |
          pip install -r requirements-airflow-lock.txt
      - run: python scripts/run_tests.py --own-env
      - run: python scripts/run_demos.py --own-env
