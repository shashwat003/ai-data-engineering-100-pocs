name: ml-pipeline
# POC 067: reproduce the DVC pipeline and enforce the data/model gates. Path-filtered so it only runs for this project.
on:
  pull_request:
    paths: ["pocs/067-cicd-for-ml/**"]
  push:
    paths: ["pocs/067-cicd-for-ml/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt -r requirements-dvc.txt
      - name: Reproduce pipeline (DVC skips unchanged stages)
        working-directory: pocs/067-cicd-for-ml/ml_project
        run: dvc init --no-scm -q && dvc repro
      - name: Gates (data validation, quality floor, regression vs baseline)
        working-directory: pocs/067-cicd-for-ml
        env:
          PYTHONPATH: .:../../libs
        run: python -m cicd_for_ml.main --check ml_project
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: pocs/067-cicd-for-ml/ml_project/metrics.json
