stages:
  prepare:
    cmd: python prepare.py
    deps: [prepare.py]
    params: [prepare]
    outs: [data/train.csv, data/test.csv]
  train:
    cmd: python train.py
    deps: [train.py, data/train.csv]
    params: [train]
    outs: [model.pkl]
  evaluate:
    cmd: python evaluate.py
    deps: [evaluate.py, model.pkl, data/test.csv]
    metrics: [metrics.json]
