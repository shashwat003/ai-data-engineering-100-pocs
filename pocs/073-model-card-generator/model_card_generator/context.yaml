# Reviewed by the model owner. The generator refuses to run if a required section is empty.
intended_use: Rank existing customers by churn risk so the retention team can prioritise outreach.
out_of_scope:
  - Credit, pricing or eligibility decisions about individual customers.
  - Customers outside the markets present in the training data.
training_data: Synthetic customer-behaviour data generated by this repository (6 numeric features, 2 subgroups). No real personal data.
limitations:
  - Trained and evaluated on synthetic data; performance on real customers is unknown.
  - Subgroup 1 contains a feature interaction that the linear model only partly captures.
